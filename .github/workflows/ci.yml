name: ci

on:
  push:
  pull_request:

env:
  # The evidence cohort's gisel; `verify-evidence` is content-addressed, so
  # this pin only decides which gisel answers the offline suites.  Keep the
  # value in one place: every job below inherits it.
  GISEL_REF: 785d679b37877ba92e88e2f18d89de3c69c9c6ef
  ANCHOR_REF: f9c44bc41bcea3ecd469ec484b934ae60fbec4d1

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: ab
          # The release-manifest test walks RELEASE.json's history and the
          # verification test resolves the cohort tag.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/checkout@v7
        with:
          repository: nodecoda/gisel
          path: gisel
          fetch-depth: 0
          ref: ${{ env.GISEL_REF }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: show the gisel pin
        run: git -C gisel rev-parse HEAD
      - name: unit tests
        working-directory: ab
        run: |
          python3 -m pip install -q pytest
          GISEL_SRC="$GITHUB_WORKSPACE/gisel" python3 -m pytest tests -q
      - name: frozen evidence still matches
        working-directory: ab
        run: VERIFY_FROZEN=1 ./scripts/verify-evidence.sh
      - name: vertical slice from frozen artifacts
        working-directory: ab
        run: |
          for target in riscv x86 aarch64; do
            python3 ab.py vertical --target "$target" \
              --out "$RUNNER_TEMP/no-live-artifacts-$target" --verify-only --frozen
          done
      - name: single-entry help needs no LLVM
        working-directory: ab
        run: python3 ab.py --help
      - name: collect diagnostics on failure
        if: failure()
        working-directory: ab
        run: python3 ab.py bug-report --out "$RUNNER_TEMP/bug-report.json" || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: bug-report-${{ matrix.python }}
          path: ${{ runner.temp }}/bug-report.json
      - name: shellcheck the shell entry points
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y shellcheck
          shellcheck -S warning ab/scripts/*.sh ab/scripts/*/*.sh

  suite:
    # The offline suites answer the frozen queries with gisel, independently
    # of the evidence cohort: they check the rules, not the recorded answers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ab
      - uses: actions/checkout@v7
        with:
          repository: nodecoda/gisel
          path: gisel
          ref: ${{ env.GISEL_REF }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: frozen offline suites
        working-directory: ab
        run: GISEL_SRC="$GITHUB_WORKSPACE/gisel" python3 ab.py suite check --all

  packaging:
    # The wheel must be installable and must not carry the evidence tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ab
      - uses: actions/checkout@v7
        with:
          repository: nodecoda/gisel
          path: gisel
          ref: ${{ env.GISEL_REF }}
      - uses: actions/checkout@v7
        with:
          repository: nodecoda/gisel-anchor
          path: gisel-anchor
          ref: ${{ env.ANCHOR_REF }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: build wheel and sdist
        working-directory: ab
        run: |
          python3 -m pip install -q build
          python3 -m build --wheel --sdist --outdir dist
      - name: evidence is not in the wheel
        working-directory: ab
        run: |
          test "$(unzip -l dist/*.whl | grep -c 'evidence/')" = 0
          test "$(tar -tzf dist/*.tar.gz | grep -c '/evidence/')" = 0
      - name: install and smoke
        working-directory: ab
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          # Install the siblings the way a user would: from their sources, so
          # the smoke does not depend on PyPI having the release yet.
          "$RUNNER_TEMP/venv/bin/pip" install -q dist/*.whl \
            "$GITHUB_WORKSPACE/gisel" "$GITHUB_WORKSPACE/gisel-anchor"
          "$RUNNER_TEMP/venv/bin/gisel-ab" --version
          "$RUNNER_TEMP/venv/bin/gisel-ab" --help
          # The installed state must find its gisel, corpus and pin by itself:
          # no GISEL_SRC, no sibling checkout on the path.
          env -u GISEL_SRC "$RUNNER_TEMP/venv/bin/gisel-ab" \
            suite check --target m68k
          # doctor must fail with an actionable rc=2, not a traceback, and
          # only the LLVM tree/build may be missing.
          if env -u GISEL_SRC "$RUNNER_TEMP/venv/bin/gisel-ab" doctor \
              > "$RUNNER_TEMP/doctor.txt"; then
            echo "doctor should fail without LLVM"
            exit 1
          fi
          cat "$RUNNER_TEMP/doctor.txt"
          grep -qE '^gisel +ok' "$RUNNER_TEMP/doctor.txt"
          grep -qE '^pin +ok' "$RUNNER_TEMP/doctor.txt"
          grep -qE '^tree +fail' "$RUNNER_TEMP/doctor.txt"
          grep -qE '^build +fail' "$RUNNER_TEMP/doctor.txt"

  cohort:
    # Fingerprints only: no gate is re-run.  A tracked input that changed
    # without a new cohort makes this red.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ab
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/checkout@v7
        with:
          repository: nodecoda/gisel
          path: gisel
          fetch-depth: 0
          ref: ${{ env.GISEL_REF }}
      - uses: actions/checkout@v7
        with:
          repository: nodecoda/gisel-anchor
          path: gisel-anchor
          fetch-depth: 0
          ref: ${{ env.ANCHOR_REF }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: cohort fingerprints
        working-directory: ab
        env:
          GISEL_SRC: ${{ github.workspace }}/gisel
          UPSTREAM_SOURCE: ${{ github.workspace }}/gisel-anchor
        run: python3 ab.py cohort check

  first-answer:
    # The usability promise: a fresh venv reaches an answer in under five
    # minutes.  Keep this independent of the developer's environment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ab
      - uses: actions/checkout@v7
        with:
          repository: nodecoda/gisel
          path: gisel
          ref: ${{ env.GISEL_REF }}
      - uses: actions/checkout@v7
        with:
          repository: nodecoda/gisel-anchor
          path: gisel-anchor
          ref: ${{ env.ANCHOR_REF }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: time to first answer
        run: ./ab/scripts/time-to-first-answer.sh
